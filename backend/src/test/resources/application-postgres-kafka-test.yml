
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fulfilment}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fulfilment-integration-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  events:
    # Separate consumer identity so a dev backend sharing this database cannot process the test events first
    consumer-name: order-fulfilment-consumer-it
    retry-backoff-ms: 500
    outbox-poll-interval-ms: 500
  seed:
    enabled: false
  kafka:
    consumer:
      auto-startup: true

management:
  health:
    kafka:
      enabled: true

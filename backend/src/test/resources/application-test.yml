spring:
  datasource:
    url: jdbc:h2:mem:fulfilment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  scheduling:
    enabled: false
  events:
    publisher:
      # Explicit test-only mode: no Kafka in the H2 profile, events are stamped published_via=SIMULATED.
      simulate-without-kafka: true
  seed:
    enabled: false

cors:
  allowed-origins: http://localhost:5173

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: fulfilment-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fulfilment}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:fulfilment-order-group}
      auto-offset-reset: earliest
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
    kafka:
      enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app:
  reservation-expiry-minutes: ${RESERVATION_EXPIRY_MINUTES:30}
  reconciliation-stale-pending-minutes: ${RECONCILIATION_STALE_PENDING_MINUTES:60}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  order-expiry-check-interval-ms: ${ORDER_EXPIRY_CHECK_INTERVAL_MS:30000}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
  events:
    outbox-poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    max-retries: ${EVENT_MAX_RETRIES:3}
    retry-backoff-ms: ${EVENT_RETRY_BACKOFF_MS:2000}
    publisher:
      send-timeout-ms: 5000
      simulate-without-kafka: false
